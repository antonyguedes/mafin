[package]
name = "mafin"
description = "Gestão financeira e de investimentos, offline-first"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# Nome distinto do binário evita conflito de artefatos no Windows.
name = "mafin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
shared = { workspace = true, features = ["sqlx"] }
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
thiserror.workspace = true
sqlx.workspace = true
pdf-extract.workspace = true
regex.workspace = true
base64.workspace = true
# Descriptografa PDFs protegidos antes do pdf-extract (ver `import::extract_pages`) e gera
# as notas sintéticas dos testes.
lopdf.workspace = true

[features]
# Expõe o gerador de notas sintéticas para o exemplo `note_fixture` (testes E2E).
test-support = []

[[example]]
name = "note_fixture"
required-features = ["test-support"]

[dev-dependencies]
tokio.workspace = true
rust_decimal_macros.workspace = true
